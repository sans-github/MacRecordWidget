<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Idle panel with the control row and live preview, light and dark."><title>Panel, Idle</title><style>
:root{--page:#f5f5f7;--ink:#1d1d1f;--ink2:#6e6e73;--rule:#d2d2d7;--card:#fff;--code:#f0f0f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#161617;--ink:#f5f5f7;--ink2:#a1a1a6;--rule:#3a3a3c;--card:#1f1f21;--code:#2a2a2c}}
:root[data-theme="dark"]{--page:#161617;--ink:#f5f5f7;--ink2:#a1a1a6;--rule:#3a3a3c;--card:#1f1f21;--code:#2a2a2c}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
main{max-width:1440px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:26px;margin:0 0 4px} h2{font-size:17px;margin:40px 0 8px} h3{font-size:13px;margin:0 0 8px;color:var(--ink2);font-weight:600}
p.lede{color:var(--ink2);margin:0 0 24px;max-width:860px}
nav.crumbs{font-size:13px;margin-bottom:16px} nav.crumbs a{color:#0a66d8}
.pair{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.stage{padding:20px;border-radius:12px;overflow-x:auto;max-width:100%}
.stage.light{background:#dfe3ea} .stage.dark{background:#0d0f12}
.note{font-size:12px;color:var(--ink2);margin:6px 0 0;max-width:720px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px;background:var(--card)}
th,td{border:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--code)} code{background:var(--code);padding:1px 5px;border-radius:4px;font-size:12px}
ul.links{padding-left:18px} ul.links li{margin:6px 0} a{color:#0a66d8}

/* macOS appearance tokens, scoped per mock so light and dark can sit side by side */
.mac{--win:#ececec;--ctl:#ffffff;--sep:rgba(0,0,0,.12);--label:rgba(0,0,0,.85);--label2:rgba(0,0,0,.5);
  --blue:#007AFF;--red:#FF383C;--amber:#FF9E33;--e0:#B8150F;--e2:#FF7A3D;--menubar:rgba(246,246,246,.85)}
.mac.dark{--win:#2b2b2d;--ctl:#1e1e1e;--sep:rgba(255,255,255,.14);--label:rgba(255,255,255,.88);--label2:rgba(255,255,255,.55);
  --e0:#8E1B12;--e2:#FF9F45;--menubar:rgba(40,40,42,.85)}
.mac{color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}

.panel{background:var(--win);border-radius:10px;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 12px 32px rgba(0,0,0,.28);overflow:hidden}
.row{display:flex;align-items:center}
.grp{display:flex;align-items:center}
.spacer{flex:1 1 auto}
.ctl{display:inline-flex;align-items:center;justify-content:center;background:var(--ctl);border:1px solid var(--sep);color:var(--label);position:relative;flex:none}
.ctl.on{background:var(--blue);border-color:transparent;color:#fff}
.ctl.on.red{background:var(--red)}
.ctl.pressed{opacity:.75} .ctl.disabled{opacity:.35}
.ctl .g.arming{opacity:.35}
.timer{display:inline-flex;align-items:center;border:1px solid var(--sep);font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.timer.idle{color:var(--label2);opacity:.65}
.menu{display:inline-flex;align-items:center;gap:5px;background:var(--ctl);border:1px solid var(--sep);min-width:0;flex:0 1 auto}
.menu span.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu .well{display:inline-flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;border-radius:3px;flex:none}
.menu.disabled{opacity:.45}
.dot{position:absolute;border-radius:50%;background:var(--amber);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
.ember{background:linear-gradient(135deg,var(--e0),var(--red),var(--e2),var(--red),var(--e0));background-size:240% 240%;
  animation:drift 3.4s linear infinite,glow 3.4s ease-in-out infinite}
@keyframes drift{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes glow{0%,100%{box-shadow:0 0 4px rgba(255,90,60,0)}50%{box-shadow:0 0 7px rgba(255,90,60,.55)}}
@media (prefers-reduced-motion:reduce){.ember{animation:none;background:var(--red)}.dot{animation:none}}
.preview{position:relative;background:linear-gradient(160deg,#cdb9a8,#9a8f86 45%,#5f6a73);display:flex;align-items:center;justify-content:center}
.preview.blank{background:#000}
.preview.dark-bg{background:var(--win)}
.msg{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--label2);text-align:center;max-width:80%}
.msg .btn{font-size:12px;color:var(--label);background:var(--ctl);border:1px solid var(--sep);border-radius:5px;padding:2px 10px;box-shadow:0 .5px 1px rgba(0,0,0,.15)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--sep);border-top-color:var(--label2);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.menubar{height:24px;background:var(--menubar);display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 12px;font-size:13px;border-radius:8px 8px 0 0}
.mbi{position:relative;display:inline-flex;color:var(--label)} .mbi.rec{color:#34C759}
.alert{width:260px;background:var(--win);border-radius:12px;padding:20px 16px 16px;text-align:center;box-shadow:0 0 0 .5px rgba(0,0,0,.3),0 16px 40px rgba(0,0,0,.35)}
.alert .ico{width:56px;height:56px;margin:0 auto 10px;border-radius:12px;background:linear-gradient(#ff6b6b,#d92b2b);display:flex;align-items:center;justify-content:center;color:#fff}
.alert b{display:block;font-size:13px;margin-bottom:6px} .alert p{font-size:11px;margin:0 0 14px;color:var(--label)}
.alert .ok{display:block;width:100%;background:var(--blue);color:#fff;border-radius:6px;padding:4px 0;font-size:13px}
</style>
